; DevRunner devbox service manager.
; The MonkeyCode Firecracker platform cannot run systemd (PID 1 is the
; platform-injected /firecracker-init), so supervisord is the image CMD and
; keeps the autostarted services alive; see devbox-guide.md.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; sshd on port 2222, root pubkey-only (see sshd-devbox.conf)
[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
startsecs=2
priority=10
stdout_logfile=/var/log/supervisor/sshd.log
stderr_logfile=/var/log/supervisor/sshd.err

; Cloudflare Tunnel connector; token comes from /etc/tun/env (baked at build)
[program:tun]
command=/usr/local/bin/tun-run
autostart=true
autorestart=true
startsecs=10
startretries=999999
priority=20
stdout_logfile=/var/log/supervisor/tun.log
stderr_logfile=/var/log/supervisor/tun.err
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
